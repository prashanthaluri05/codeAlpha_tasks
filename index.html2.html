<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .quote-card {
            background: white;
            border-radius: 24px;
            padding: 45px 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .title {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 30px;
        }

        .quote-icon {
            font-size: 55px;
            color: #667eea;
            line-height: 1;
            margin-bottom: 15px;
        }

        #quote {
            font-size: 26px;
            line-height: 1.5;
            color: #333;
            margin-bottom: 20px;
            font-style: italic;
        }

        #author {
            font-size: 18px;
            font-weight: bold;
            color: #666;
            margin-bottom: 35px;
        }

        #newQuote {
            border: none;
            background: #667eea;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        #newQuote:hover {
            background: #5568d9;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
        }

        #newQuote:active {
            transform: translateY(0);
        }

        @media (max-width: 500px) {
            .quote-card {
                padding: 35px 25px;
            }

            #quote {
                font-size: 21px;
            }

            .title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <section class="quote-card">
            <h1 class="title">Random Quote Generator</h1>

            <div class="quote-icon">“</div>

            <p id="quote">Loading quote...</p>

            <p id="author"></p>

            <button id="newQuote">New Quote</button>
        </section>
    </main>

    <script>
        const quotes = [
            {
                text: "The only way to do great work is to love what you do.",
                author: "Steve Jobs"
            },
            {
                text: "It always seems impossible until it's done.",
                author: "Nelson Mandela"
            },
            {
                text: "Success is not final, failure is not fatal: it is the courage to continue that counts.",
                author: "Winston Churchill"
            },
            {
                text: "Believe you can and you're halfway there.",
                author: "Theodore Roosevelt"
            },
            {
                text: "The future belongs to those who believe in the beauty of their dreams.",
                author: "Eleanor Roosevelt"
            },
            {
                text: "Do what you can, with what you have, where you are.",
                author: "Theodore Roosevelt"
            },
            {
                text: "Everything you've ever wanted is on the other side of fear.",
                author: "George Addair"
            },
            {
                text: "The secret of getting ahead is getting started.",
                author: "Mark Twain"
            },
            {
                text: "Great things are done by a series of small things brought together.",
                author: "Vincent van Gogh"
            },
            {
                text: "You miss 100% of the shots you don't take.",
                author: "Wayne Gretzky"
            }
        ];

        const quoteElement = document.getElementById("quote");
        const authorElement = document.getElementById("author");
        const button = document.getElementById("newQuote");

        let lastQuoteIndex = -1;

        function showRandomQuote() {
            let randomIndex;

            // Make sure the same quote isn't shown twice in a row
            do {
                randomIndex = Math.floor(Math.random() * quotes.length);
            } while (randomIndex === lastQuoteIndex && quotes.length > 1);

            lastQuoteIndex = randomIndex;

            const selectedQuote = quotes[randomIndex];

            quoteElement.textContent = `"${selectedQuote.text}"`;
            authorElement.textContent = `— ${selectedQuote.author}`;
        }

        // Display a random quote when the app opens
        showRandomQuote();

        // Display a different random quote on every button click
        button.addEventListener("click", showRandomQuote);
    </script>

</body>
</html>
