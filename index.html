<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcard Quiz App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #1e293b;
    }

    .app {
      width: 100%;
      max-width: 650px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #4f46e5;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    .counter {
      text-align: center;
      color: #64748b;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .flashcard {
      min-height: 280px;
      border-radius: 18px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 35px;
      margin-bottom: 20px;
    }

    .card-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.8;
      margin-bottom: 15px;
    }

    #cardText {
      font-size: 28px;
      line-height: 1.4;
      font-weight: bold;
    }

    .answer {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.3);
      width: 100%;
      display: none;
    }

    .answer.show {
      display: block;
    }

    .answer-label {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 8px;
    }

    #answerText {
      font-size: 20px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .show-answer {
      display: block;
      margin: 0 auto 20px;
      background: #f59e0b;
      color: white;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 25px;
    }

    .navigation button {
      flex: 1;
      background: #e2e8f0;
      color: #1e293b;
    }

    .management {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .add {
      background: #22c55e;
      color: white;
    }

    .edit {
      background: #3b82f6;
      color: white;
    }

    .delete {
      background: #ef4444;
      color: white;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 450px;
      background: white;
      border-radius: 18px;
      padding: 25px;
    }

    .modal-content h2 {
      margin-bottom: 20px;
      color: #4f46e5;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .form-group textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      resize: vertical;
      font-size: 15px;
      outline: none;
    }

    .form-group textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons button {
      flex: 1;
    }

    .save {
      background: #4f46e5;
      color: white;
    }

    .cancel {
      background: #e2e8f0;
      color: #1e293b;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #64748b;
    }

    @media (max-width: 500px) {
      .app {
        padding: 20px;
      }

      #cardText {
        font-size: 23px;
      }

      .management {
        grid-template-columns: 1fr;
      }

      .navigation {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>📚 Flashcard Quiz</h1>
    <p class="subtitle">Study smarter, one card at a time.</p>

    <div class="counter" id="counter"></div>

    <div class="flashcard" id="flashcard">
      <div class="card-label">Question</div>

      <div id="cardText"></div>

      <div class="answer" id="answer">
        <div class="answer-label">Answer</div>
        <div id="answerText"></div>
      </div>
    </div>

    <button class="show-answer" id="showAnswer">
      👁 Show Answer
    </button>

    <div class="navigation">
      <button id="previous">← Previous</button>
      <button id="next">Next →</button>
    </div>

    <div class="management">
      <button class="add" id="addCard">＋ Add</button>
      <button class="edit" id="editCard">✏ Edit</button>
      <button class="delete" id="deleteCard">🗑 Delete</button>
    </div>

  </div>

  <!-- Add/Edit Modal -->
  <div class="modal" id="modal">

    <div class="modal-content">

      <h2 id="modalTitle">Add Flashcard</h2>

      <div class="form-group">
        <label for="questionInput">Question</label>
        <textarea
          id="questionInput"
          placeholder="Enter your question..."
        ></textarea>
      </div>

      <div class="form-group">
        <label for="answerInput">Answer</label>
        <textarea
          id="answerInput"
          placeholder="Enter the answer..."
        ></textarea>
      </div>

      <div class="modal-buttons">
        <button class="cancel" id="cancelModal">
          Cancel
        </button>

        <button class="save" id="saveCard">
          Save Card
        </button>
      </div>

    </div>

  </div>

  <script>
    // Initial flashcards
    let flashcards = [
      {
        question: "What is HTML?",
        answer: "HTML stands for HyperText Markup Language and is used to structure web pages."
      },
      {
        question: "What is CSS?",
        answer: "CSS stands for Cascading Style Sheets and is used to style web pages."
      },
      {
        question: "What is JavaScript?",
        answer: "JavaScript is a programming language used to make web pages interactive."
      }
    ];

    let currentIndex = 0;
    let editingIndex = null;

    // Elements
    const cardText = document.getElementById("cardText");
    const answerText = document.getElementById("answerText");
    const answer = document.getElementById("answer");
    const counter = document.getElementById("counter");

    const showAnswerBtn = document.getElementById("showAnswer");
    const previousBtn = document.getElementById("previous");
    const nextBtn = document.getElementById("next");

    const addCardBtn = document.getElementById("addCard");
    const editCardBtn = document.getElementById("editCard");
    const deleteCardBtn = document.getElementById("deleteCard");

    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");

    const questionInput = document.getElementById("questionInput");
    const answerInput = document.getElementById("answerInput");

    const saveCardBtn = document.getElementById("saveCard");
    const cancelModalBtn = document.getElementById("cancelModal");

    // Display current card
    function displayCard() {

      if (flashcards.length === 0) {
        cardText.textContent = "No flashcards available.";
        answerText.textContent = "";
        counter.textContent = "0 cards";

        showAnswerBtn.style.display = "none";
        previousBtn.disabled = true;
        nextBtn.disabled = true;
        editCardBtn.disabled = true;
        deleteCardBtn.disabled = true;

        return;
      }

      showAnswerBtn.style.display = "block";

      previousBtn.disabled = false;
      nextBtn.disabled = false;
      editCardBtn.disabled = false;
      deleteCardBtn.disabled = false;

      const card = flashcards[currentIndex];

      cardText.textContent = card.question;
      answerText.textContent = card.answer;

      counter.textContent =
        `Card ${currentIndex + 1} of ${flashcards.length}`;

      // Hide answer when changing cards
      answer.classList.remove("show");
      showAnswerBtn.textContent = "👁 Show Answer";

      updateNavigationButtons();
    }

    // Previous / Next button states
    function updateNavigationButtons() {
      previousBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === flashcards.length - 1;

      previousBtn.style.opacity =
        previousBtn.disabled ? "0.5" : "1";

      nextBtn.style.opacity =
        nextBtn.disabled ? "0.5" : "1";
    }

    // Show / hide answer
    showAnswerBtn.addEventListener("click", () => {

      if (answer.classList.contains("show")) {
        answer.classList.remove("show");
        showAnswerBtn.textContent = "👁 Show Answer";
      } else {
        answer.classList.add("show");
        showAnswerBtn.textContent = "🙈 Hide Answer";
      }

    });

    // Previous
    previousBtn.addEventListener("click", () => {

      if (currentIndex > 0) {
        currentIndex--;
        displayCard();
      }

    });

    // Next
    nextBtn.addEventListener("click", () => {

      if (currentIndex < flashcards.length - 1) {
        currentIndex++;
        displayCard();
      }

    });

    // Open Add modal
    addCardBtn.addEventListener("click", () => {

      editingIndex = null;

      modalTitle.textContent = "Add Flashcard";

      questionInput.value = "";
      answerInput.value = "";

      modal.classList.add("active");

      questionInput.focus();
    });

    // Open Edit modal
    editCardBtn.addEventListener("click", () => {

      if (flashcards.length === 0) return;

      editingIndex = currentIndex;

      modalTitle.textContent = "Edit Flashcard";

      questionInput.value =
        flashcards[currentIndex].question;

      answerInput.value =
        flashcards[currentIndex].answer;

      modal.classList.add("active");

      questionInput.focus();
    });

    // Save card
    saveCardBtn.addEventListener("click", () => {

      const question = questionInput.value.trim();
      const answerValue = answerInput.value.trim();

      if (!question || !answerValue) {
        alert("Please enter both a question and an answer.");
        return;
      }

      const newCard = {
        question: question,
        answer: answerValue
      };

      if (editingIndex === null) {

        // Add new card
        flashcards.push(newCard);

        currentIndex = flashcards.length - 1;

      } else {

        // Edit existing card
        flashcards[editingIndex] = newCard;

        currentIndex = editingIndex;
      }

      closeModal();
      displayCard();
    });

    // Delete card
    deleteCardBtn.addEventListener("click", () => {

      if (flashcards.length === 0) return;

      const confirmed = confirm(
        "Are you sure you want to delete this flashcard?"
      );

      if (!confirmed) return;

      flashcards.splice(currentIndex, 1);

      if (currentIndex >= flashcards.length) {
        currentIndex = flashcards.length - 1;
      }

      displayCard();
    });

    // Cancel modal
    cancelModalBtn.addEventListener("click", closeModal);

    // Close modal when clicking outside
    modal.addEventListener("click", (event) => {

      if (event.target === modal) {
        closeModal();
      }

    });

    function closeModal() {
      modal.classList.remove("active");
      questionInput.value = "";
      answerInput.value = "";
      editingIndex = null;
    }

    // Keyboard shortcuts
    document.addEventListener("keydown", (event) => {

      if (modal.classList.contains("active")) return;

      if (event.key === "ArrowRight") {
        nextBtn.click();
      }

      if (event.key === "ArrowLeft") {
        previousBtn.click();
      }

      if (event.key === " ") {
        event.preventDefault();
        showAnswerBtn.click();
      }
    });

    // Start application
    displayCard();
  </script>

</body>
</html>
